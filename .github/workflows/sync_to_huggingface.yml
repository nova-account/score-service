name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Push the current commit (HEAD) to the remote main branch on Hugging Face
          git push --force https://beaw0w:$HF_TOKEN@huggingface.co/spaces/beaw0w/score-service HEAD:refs/heads/main
